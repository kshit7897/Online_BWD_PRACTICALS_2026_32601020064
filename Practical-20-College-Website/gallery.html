<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | FCA - Marwadi University</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">&#9670; MU Computer Applications</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                    aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="page-header text-white text-center">
        <h1>Gallery</h1>
        <p class="mb-0">Moments from our campus. Click on an image to enlarge.</p>
    </header>

    <section class="container my-5">
        <div class="row g-3">
            <div class="col-6 col-md-4">
                <img src="images/campus.svg" class="img-fluid rounded gallery-img" alt="College Campus">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/lab.svg" class="img-fluid rounded gallery-img" alt="Computer Lab">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/library.svg" class="img-fluid rounded gallery-img" alt="Library">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/fest.svg" class="img-fluid rounded gallery-img" alt="Tech Fest">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/sports.svg" class="img-fluid rounded gallery-img" alt="Sports Day">
            </div>
            <div class="col-6 col-md-4">
                <img src="images/convocation.svg" class="img-fluid rounded gallery-img" alt="Convocation">
            </div>
        </div>
    </section>

    <!-- Bootstrap modal to show the clicked image -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageModalTitle">Image</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalImage" src="" class="img-fluid rounded" alt="">
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer text-white py-4">
        <div class="container text-center">
            <p class="mb-1">Faculty of Computer Applications, Marwadi University, Rajkot</p>
            <p class="mb-0 small">&copy; <span class="year"></span> FCA. All rights reserved.</p>
        </div>
    </footer>

    <button id="backToTop" class="back-to-top" title="Back to top">&uarr;</button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
